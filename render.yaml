services:
  - type: web
    name: famwell-api
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn api.main:create_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/backend/.prisma
      - key: DATABASE_URL
        generateValue: false
      - key: REDIS_URL
        generateValue: false
      - key: JWT_SECRET_KEY
        generateValue: false
      - key: GOOGLE_CLIENT_ID
        generateValue: false
      - key: AZURE_OPENAI_ENDPOINT
        generateValue: false
      - key: AZURE_OPENAI_API_KEY
        generateValue: false
      - key: AZURE_OPENAI_DEPLOYMENT
        generateValue: false
      - key: AZURE_OPENAI_API_VERSION
        generateValue: false
