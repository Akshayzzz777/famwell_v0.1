<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Home Dashboard</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#E0F2F1',
              soft: '#B2DFDB',
              primary: '#4DB6AC',
              accent: '#80CBC4'
            }
          }
        }
      }
    }
  </script>
<!-- Layout and Utility Styles -->
<style data-purpose="layout-styles">
    body {
      background-color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="antialiased text-slate-800">
<!-- BEGIN: MainContainer -->
<div class="flex flex-col min-h-screen max-w-md mx-auto bg-slate-50 relative">
<!-- BEGIN: GreetingHeader -->
<header class="pt-12 pb-6 px-6 bg-gradient-to-b from-brand-soft to-transparent" data-purpose="main-header">
<div class="flex justify-between items-center">
<div>
<h1 class="text-3xl font-bold text-slate-900">Hello, Family</h1>
<p class="text-slate-600 text-sm mt-1">Keep everyone healthy today</p>
</div>
<button class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand-primary">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: GreetingHeader -->
<main class="flex-grow px-6 space-y-8">
<!-- BEGIN: FamilyMemberList -->
<section data-purpose="family-members">
<div class="flex items-center justify-between mb-4">
<h2 class="text-lg font-semibold text-slate-800">Family Members</h2>
<button class="text-brand-primary text-sm font-medium">Manage</button>
</div>
<!-- Horizontal scroll list of members -->
<div class="flex gap-4 overflow-x-auto custom-scrollbar pb-2">
<!-- Member Card 1 -->
<div class="flex-shrink-0 flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-2xl bg-brand-light border-2 border-brand-accent overflow-hidden shadow-sm">
<img alt="Dad" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuACIPozHz0M0TVisxHauUcYgOUJruUkOSwGMBLSKvm9d5muomgV3taQwRojjEkDGl-N1wAbComsgOL6PBjXKakAExCNPovgGw9LC40obYXedCtppYEE_Fd1exgRWQPF97IHi02ug_r1CmzO_KnwZWRnw96HFJQzy_NNTlvWhoUoX2j7r-2-_FnhB0Rh4Y_GqxqM4LRYaD-ZeeFj7VNDYoEWpo-PxV2ostyX-AOIaIMe9TyYSix1PfUYOhlybxjq7v7dcm2f8o6-Va4m"/>
</div>
<span class="text-xs font-medium">Dad</span>
</div>
<!-- Member Card 2 -->
<div class="flex-shrink-0 flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-2xl bg-brand-light border-2 border-white overflow-hidden shadow-sm">
<img alt="Mom" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwNAtXhm1IL1G-0PdqhSMWLtpqinGzLFDe1jT668fMhPEzYrxHldxEQ16EEqsAGdEboF7Hq0d3zQrqq2A03PtL4yp_FBwOO_vUE09GqCEvam1MvfUvnckyrV9jBTyJrvN45bR1QC4v6wGXNwZsGeJhNyOC80H5ifxok-nvQ0cCUQgAYQQ5pGayE5oBLr0UnrFrmHbcUq3Sw-yfzCunnXlH_2wWyQeztmgXvAiArI2luY_FyOxqpElcKRQFYqy_qNrocZaOUbBtb9RA"/>
</div>
<span class="text-xs font-medium">Mom</span>
</div>
<!-- Member Card 3 -->
<div class="flex-shrink-0 flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-2xl bg-brand-light border-2 border-white overflow-hidden shadow-sm">
<img alt="Leo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8g5YzyRMwsodhQp4amogXWR0qotoaafBWcPhZu_mERa_Q6wJdRHTpZiVvtUDLZ_CUGga3UYpX4a0SqLVjv4k2ueyX1OqvfWGN7euZKC9HF3oUMIPvZ989y97iYHzYoNM1C2sHo0wJBFX4W4AlZFy1w5ybOqFS2Ei72d8GGmNzxxOttNWPtxOUuvy_TjXEVQv8v-U55B-sqCoBUSIRY811vpBMdYg4gqq0WMurYUFcS30Jmfw6ZYF1RZqA9mfajBdKPwo3mtO8Lgqq"/>
</div>
<span class="text-xs font-medium">Leo</span>
</div>
<!-- Member Card 4 -->
<div class="flex-shrink-0 flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-2xl bg-brand-light border-2 border-white overflow-hidden shadow-sm">
<img alt="Mia" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAH4F-aAY8zpYcGl5O85btGAJpAQDSA5uqdSydYycj38wACBJaBnhDiJ8FpDUGizAK5_eiKqgp5-rDx3zBuBsVM0L_ZQ4IQBwXQYjo9ZtY0jEmnn1Kgya39EkyyrnEnvw5bp6J8imu51eQ1m55BE8BkUrqGQ46g-waKFEah-7mV8fM1VjHObzUw1e-8ljTmW5wlR0twr6ggdLbH3iP_CMsqQFs_4fzDBULWVFqIzQwIVREu6x2cO-Bjyp0ykkRI-aWeUZhgFfDfzuRd"/>
</div>
<span class="text-xs font-medium">Mia</span>
</div>
<!-- Add Member Button -->
<div class="flex-shrink-0 flex flex-col items-center gap-2">
<button class="w-16 h-16 rounded-2xl bg-white border-2 border-dashed border-brand-accent flex items-center justify-center text-brand-primary hover:bg-brand-light transition-colors">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-xs font-medium">Add</span>
</div>
</div>
</section>
<!-- END: FamilyMemberList -->
<!-- BEGIN: QuickActionsGrid -->
<section data-purpose="quick-actions">
<h2 class="text-lg font-semibold text-slate-800 mb-4">Quick Actions</h2>
<div class="grid grid-cols-2 gap-4">
<!-- View Health Records -->
<div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3 active:scale-95 transition-transform cursor-pointer">
<div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-bold text-slate-700 leading-tight">Health<br/>Records</span>
</div>
<!-- Medication Reminders -->
<div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3 active:scale-95 transition-transform cursor-pointer">
<div class="w-10 h-10 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-bold text-slate-700 leading-tight">Medication<br/>Reminders</span>
</div>
<!-- Emergency Contacts -->
<div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3 active:scale-95 transition-transform cursor-pointer">
<div class="w-10 h-10 bg-red-50 text-red-500 rounded-xl flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-bold text-slate-700 leading-tight">Emergency<br/>Contacts</span>
</div>
<!-- Daily Tips (Secondary action) -->
<div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3 active:scale-95 transition-transform cursor-pointer">
<div class="w-10 h-10 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-bold text-slate-700 leading-tight">Wellness<br/>Tips</span>
</div>
</div>
</section>
<!-- END: QuickActionsGrid -->
<!-- BEGIN: HealthStatusCard -->
<section class="pb-24" data-purpose="health-summary">
<div class="bg-brand-primary p-5 rounded-[2rem] text-white shadow-lg shadow-brand-soft/50 flex flex-col gap-4">
<div class="flex justify-between items-start">
<h3 class="font-bold text-lg">Family Status</h3>
<span class="bg-white/20 text-[10px] uppercase tracking-wider font-bold py-1 px-3 rounded-full">Live Now</span>
</div>
<div class="flex items-center gap-4">
<div class="bg-white/20 p-3 rounded-2xl">
<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-white/80 text-sm">All vitals are normal</p>
<p class="text-xl font-bold">Health Score: 94%</p>
</div>
</div>
</div>
</section>
<!-- END: HealthStatusCard -->
</main>
<!-- BEGIN: BottomNavigation -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-lg border-t border-slate-100 flex justify-between px-8 pt-4 pb-4 safe-bottom z-50" data-purpose="bottom-nav">
<!-- Nav Item: Home -->
<a class="flex flex-col items-center gap-1 text-brand-primary" href="#">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75v4.5a.75.75 0 01-.75.75H5.625c-1.035 0-1.875-.84-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
</svg>
<span class="text-[10px] font-bold">Home</span>
</a>
<!-- Nav Item: Calendar -->
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" stroke-linecap="round" stroke-linejoin="round"></path>

<span class="text-[10px] font-bold">Events</span>

<!-- Nav Item: Plus (FAB style) -->
<div class="-mt-8">
<button class="w-14 h-14 bg-brand-primary text-white rounded-full shadow-lg flex items-center justify-center border-4 border-slate-50">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Nav Item: Chat -->
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-bold">Chat</span>
</a>
<!-- Nav Item: Profile -->
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MainContainer -->
</body></html>
