<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Medication Reminders</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Font config (Inter is standard for clean UI) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="custom-layout">
    /* Fix for mobile Safari height issues */
    .app-container {
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    /* Custom toggle switch styling to supplement Tailwind */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #10B981;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #10B981;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
<!-- BEGIN: AppContainer -->
<div class="app-container flex flex-col max-w-md mx-auto bg-white shadow-xl min-h-screen relative overflow-hidden">
<!-- BEGIN: Header -->
<header class="pt-12 pb-6 px-6 bg-white border-b border-slate-100 sticky top-0 z-10" data-purpose="main-header">
<div class="flex justify-between items-center">
<div>
<h1 class="text-2xl font-bold tracking-tight">Medications</h1>
<p class="text-slate-500 text-sm">FamWell Daily Care</p>
</div>
<button aria-label="Settings" class="bg-indigo-50 p-2 rounded-full text-indigo-600">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: MedicationList -->
<main class="flex-grow px-6 py-6 overflow-y-auto" data-purpose="medication-list-container">
<!-- Date Heading -->
<div class="mb-6">
<h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Today, Oct 24</h2>
</div>
<div class="space-y-4">
<!-- Medication Item 1 -->
<article class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between" data-purpose="medication-card">
<div class="flex items-center space-x-4">
<div class="bg-blue-100 p-3 rounded-xl text-blue-600">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h3 class="font-bold text-slate-800 text-lg leading-tight">Lisinopril</h3>
<p class="text-slate-500 text-sm">10mg • 08:00 AM</p>
</div>
</div>
<div class="flex items-center">
<label class="relative inline-flex items-center cursor-pointer" for="reminder-1">
<input checked="" class="sr-only peer" id="reminder-1" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
</label>
</div>
</article>
<!-- Medication Item 2 -->
<article class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between" data-purpose="medication-card">
<div class="flex items-center space-x-4">
<div class="bg-orange-100 p-3 rounded-xl text-orange-600">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h3 class="font-bold text-slate-800 text-lg leading-tight">Vitamin D3</h3>
<p class="text-slate-500 text-sm">2000 IU • 12:30 PM</p>
</div>
</div>
<div class="flex items-center">
<label class="relative inline-flex items-center cursor-pointer" for="reminder-2">
<input checked="" class="sr-only peer" id="reminder-2" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
</label>
</div>
</article>
<!-- Medication Item 3 (Off Toggle) -->
<article class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between opacity-75" data-purpose="medication-card">
<div class="flex items-center space-x-4">
<div class="bg-purple-100 p-3 rounded-xl text-purple-600">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h3 class="font-bold text-slate-800 text-lg leading-tight">Metformin</h3>
<p class="text-slate-500 text-sm">500mg • 06:00 PM</p>
</div>
</div>
<div class="flex items-center">
<label class="relative inline-flex items-center cursor-pointer" for="reminder-3">
<input class="sr-only peer" id="reminder-3" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
</label>
</div>
</article>
</div>
<!-- BEGIN: ActionButton -->
<div class="mt-8 mb-20">
<button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all transform active:scale-[0.98] flex items-center justify-center space-x-2" data-purpose="add-medication-btn">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
<span>Add Medication</span>
</button>
</div>
<!-- END: ActionButton -->
</main>
<!-- END: MedicationList -->
<!-- BEGIN: BottomNavigation -->
<nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-4 flex justify-between items-center" data-purpose="bottom-nav">
<a class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors" href="#">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold uppercase">Home</span>
</a>
<a class="flex flex-col items-center text-indigo-600" href="#">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold uppercase">Meds</span>
</a>
<a class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors" href="#">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold uppercase">Family</span>
</a>
<a class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors" href="#">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold uppercase">Profile</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: AppContainer -->
</body></html>
