<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Login</title>
<!-- Tailwind CSS CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#EBF4FF',
              soft: '#60A5FA',
              DEFAULT: '#3B82F6',
              dark: '#1D4ED8'
            }
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-transitions">
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6 font-sans antialiased text-slate-800">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-sm fade-in" data-purpose="login-container">
<!-- BEGIN: BrandHeader -->
<header class="text-center mb-10" data-purpose="brand-identity">
<div class="inline-flex items-center justify-center w-16 h-16 bg-brand rounded-2xl mb-4 shadow-lg shadow-blue-100">
<!-- Placeholder for Brand Icon -->
<svg class="h-10 w-10 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900">FamWell</h1>
<p class="text-slate-500 mt-2">Connect and thrive with your family</p>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: LoginForm -->
<section class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100" data-purpose="login-card">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field Group -->
<div class="space-y-1">
<label class="block text-sm font-medium text-slate-700 ml-1" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:ring-brand focus:border-brand transition-all bg-slate-50/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field Group -->
<div class="space-y-1">
<div class="flex items-center justify-between px-1">
<label class="block text-sm font-medium text-slate-700" for="password">Password</label>
<a class="text-xs font-semibold text-brand hover:text-brand-dark transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:ring-brand focus:border-brand transition-all bg-slate-50/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-4 rounded-xl shadow-md shadow-blue-200 transition-all transform active:scale-[0.98]" type="submit">
          Login
        </button>
</form>
</section>
<!-- END: LoginForm -->
<!-- BEGIN: FooterLinks -->
<footer class="mt-8 text-center" data-purpose="onboarding-links">
<p class="text-slate-500 text-sm">
        Don't have an account? 
        <a class="font-bold text-brand hover:underline decoration-2 underline-offset-4 ml-1" href="#">Sign up</a>
</p>
<!-- Optional Legal Links -->
<div class="mt-12 flex justify-center space-x-4 text-[10px] uppercase tracking-widest text-slate-400">
<a class="hover:text-slate-600" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-slate-600" href="#">Terms of Service</a>
</div>
</footer>
<!-- END: FooterLinks -->
</main>
<!-- END: MainContainer -->
<script data-purpose="form-interactivity">
    // Minimal script to handle form visual feedback
    document.querySelector('form').addEventListener('submit', function(e) {
      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin mr-2">↻</span> Logging in...';
      // In a real app, logic for authentication would go here
    });
  </script>
</body></html>
