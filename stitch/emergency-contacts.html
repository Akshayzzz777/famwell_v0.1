<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Emergency Contacts</title>
<!-- BEGIN: Scripts and Stylesheets -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'famwell-blue': '#E0F2F1',
            'famwell-teal': '#4DB6AC',
            'famwell-dark-teal': '#00796B',
            'famwell-soft-green': '#F1F8E9'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-animations">
    .tap-active:active {
      transform: scale(0.98);
      transition: transform 0.1s;
    }
  </style>
<!-- END: Scripts and Stylesheets -->
</head>
<body class="bg-famwell-blue min-h-screen flex flex-col font-sans text-slate-800">
<!-- BEGIN: MainHeader -->
<header class="bg-white px-6 pt-12 pb-6 shadow-sm rounded-b-3xl">
<div class="flex justify-between items-center">
<div>
<h1 class="text-2xl font-bold text-famwell-dark-teal">Emergency Contacts</h1>
<p class="text-sm text-slate-500">Quick access when it matters most</p>
</div>
<button class="bg-famwell-teal text-white p-3 rounded-full shadow-lg tap-active" data-purpose="add-contact-button">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: ContactsList -->
<main class="flex-grow px-6 py-8 overflow-y-auto">
<div class="space-y-4" data-purpose="contact-card-container">
<!-- Contact Card: Mom -->
<div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-famwell-soft-green" data-purpose="contact-card">
<div class="flex items-center space-x-4">
<!-- Avatar Placeholder -->
<div class="w-12 h-12 bg-famwell-soft-green rounded-full flex items-center justify-center text-famwell-teal font-bold text-lg">
            M
          </div>
<div>
<h3 class="font-semibold text-slate-800">Mom</h3>
<p class="text-xs text-slate-400">Primary Emergency</p>
</div>
</div>
<a class="bg-famwell-soft-green p-3 rounded-full text-famwell-dark-teal tap-active" data-purpose="call-action" href="tel:1234567890">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</div>
<!-- Contact Card: Dad -->
<div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-famwell-soft-green" data-purpose="contact-card">
<div class="flex items-center space-x-4">
<div class="w-12 h-12 bg-famwell-soft-green rounded-full flex items-center justify-center text-famwell-teal font-bold text-lg">
            D
          </div>
<div>
<h3 class="font-semibold text-slate-800">Dad</h3>
<p class="text-xs text-slate-400">Mobile</p>
</div>
</div>
<a class="bg-famwell-soft-green p-3 rounded-full text-famwell-dark-teal tap-active" data-purpose="call-action" href="tel:1234567890">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</div>
<!-- Contact Card: Dr. Smith -->
<div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-famwell-soft-green" data-purpose="contact-card">
<div class="flex items-center space-x-4">
<div class="w-12 h-12 bg-famwell-soft-green rounded-full flex items-center justify-center text-famwell-teal font-bold text-lg">
            S
          </div>
<div>
<h3 class="font-semibold text-slate-800">Dr. Smith</h3>
<p class="text-xs text-slate-400">Family Physician</p>
</div>
</div>
<a class="bg-famwell-soft-green p-3 rounded-full text-famwell-dark-teal tap-active" data-purpose="call-action" href="tel:1234567890">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</div>
</div>
</main>
<!-- END: ContactsList -->

<div class="flex justify-between items-center max-w-md mx-auto">
<!-- Nav Item: Home -->
<a class="flex flex-col items-center space-y-1 text-slate-400" href="#">

<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] uppercase font-bold tracking-wider">More</span>

</div>
</nav>

</body></html>
