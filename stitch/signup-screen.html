<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Sign Up</title>
<!-- Tailwind CSS CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration for Brand Colors -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              soft: '#E8F4F8',    /* Very light blue-grey */
              primary: '#6B9080', /* Calming Sage Green */
              secondary: '#A4C3B2', /* Soft Mint */
              accent: '#CCE3DE',    /* Pale Aqua */
              text: '#4A5568'      /* Soft Dark Grey */
            }
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for UI Enhancements -->
<style data-purpose="custom-typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
    }
  </style>
</head>
<body class="bg-brand-soft min-h-screen flex flex-col justify-center items-center p-6">
<!-- BEGIN: SignupContainer -->
<main class="w-full max-w-md bg-white rounded-2xl shadow-sm p-8" data-purpose="signup-card">
<!-- BEGIN: HeaderSection -->
<header class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-brand-secondary rounded-full mb-4">
<!-- Brand Icon Placeholder -->
<svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-3xl font-semibold text-brand-text mb-2">FamWell</h1>
<p class="text-slate-500">Create your health-focused account</p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: SignupForm -->
<form action="#" class="space-y-5" data-purpose="signup-form" method="POST">
<!-- Name Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-brand-text ml-1" for="full-name">Full Name</label>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:border-brand-primary focus:ring-brand-primary transition duration-200 bg-slate-50" id="full-name" name="full-name" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-brand-text ml-1" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:border-brand-primary focus:ring-brand-primary transition duration-200 bg-slate-50" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Phone Number Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-brand-text ml-1" for="phone">Phone Number</label>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:border-brand-primary focus:ring-brand-primary transition duration-200 bg-slate-50" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
<!-- Password Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-brand-text ml-1" for="password">Password</label>
<input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:border-brand-primary focus:ring-brand-primary transition duration-200 bg-slate-50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full py-4 px-6 bg-brand-primary hover:bg-opacity-90 text-white font-semibold rounded-xl shadow-md transition-all duration-300 transform active:scale-[0.98]" data-purpose="submit-button" type="submit">
          Create account
        </button>
</div>
</form>
<!-- END: SignupForm -->
<!-- BEGIN: FooterLinks -->
<footer class="mt-8 text-center" data-purpose="form-footer">
<p class="text-sm text-slate-500">
        Already have an account? 
        <a class="text-brand-primary font-semibold hover:underline" href="#">Log in</a>
</p>
<div class="mt-6 flex justify-center space-x-4 text-xs text-slate-400">
<a class="hover:text-brand-text" href="#">Terms of Service</a>
<span>•</span>
<a class="hover:text-brand-text" href="#">Privacy Policy</a>
</div>
</footer>
<!-- END: FooterLinks -->
</main>
<!-- END: SignupContainer -->
</body></html>
