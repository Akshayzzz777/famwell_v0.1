<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamWell - Settings</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="layout-adjustments">
    /* Ensure the mobile view feels native on iOS */
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .settings-item:active {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col">
<!-- BEGIN: Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-4" data-purpose="app-header">
<div class="flex items-center justify-between max-w-md mx-auto">
<h1 class="text-xl font-semibold">Settings</h1>
<!-- User profile shortcut/avatar -->
<div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-medium text-sm">
        JS
      </div>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-grow max-w-md mx-auto w-full py-6 px-4" data-purpose="settings-list-container">
<!-- BEGIN: Profile Section -->
<section class="mb-8">
<h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-1">Account</h2>
<div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">
<!-- Profile Item -->
<a class="settings-item flex items-center justify-between p-4 transition-colors border-b border-gray-100" data-purpose="nav-profile" href="#">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-medium text-gray-700">Profile</span>
</div>
<svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Notifications Item -->
<a class="settings-item flex items-center justify-between p-4 transition-colors" data-purpose="nav-notifications" href="#">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-medium text-gray-700">Notifications</span>
</div>
<svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</section>
<!-- END: Profile Section -->
<!-- BEGIN: Security Section -->
<section class="mb-8">
<h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-1">Security &amp; Privacy</h2>
<div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">
<!-- Privacy Item -->
<a class="settings-item flex items-center justify-between p-4 transition-colors" data-purpose="nav-privacy" href="#">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-medium text-gray-700">Privacy</span>
</div>
<svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</section>
<!-- END: Security Section -->
<!-- BEGIN: Logout Section -->
<section>
<div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">
<button class="settings-item w-full flex items-center justify-between p-4 transition-colors" data-purpose="logout-button">
<div class="flex items-center gap-3 text-red-500">
<div class="w-8 h-8 flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-medium">Logout</span>
</div>
</button>
</div>
</section>
<!-- END: Logout Section -->
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation -->
<nav class="bg-white border-t border-gray-200 safe-area-bottom sticky bottom-0" data-purpose="bottom-navigation">
<div class="max-w-md mx-auto flex items-center justify-around py-2 px-4">
<!-- Home Link -->
<a class="flex flex-col items-center gap-1 p-2 text-gray-400 hover:text-indigo-600 transition-colors" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Home</span>
</a>
<!-- Family Link -->
<a class="flex flex-col items-center gap-1 p-2 text-gray-400 hover:text-indigo-600 transition-colors" href="#">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a5.97 5.97 0 0 0-.942 3.197M12 10.5a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm-7 0a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm14 0a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Family</span>
</a>
<!-- Settings Link (Active) -->
<a class="flex flex-col items-center gap-1 p-2 text-indigo-600 transition-colors" href="#">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 0 0-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 0 0-2.282.819l-.922 1.597a1.875 1.875 0 0 0 .432 2.385l.84.692c.095.078.17.229.154.43a7.598 7.598 0 0 0 0 1.139c.015.2-.059.352-.153.43l-.841.692a1.875 1.875 0 0 0-.432 2.385l.922 1.597a1.875 1.875 0 0 0 2.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.115-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 0 0 2.282-.819l.923-1.597a1.875 1.875 0 0 0-.432-2.385l-.84-.692c-.095-.078-.17-.229-.154-.43a7.614 7.614 0 0 0 0-1.139c-.016-.2.059-.352.153-.43l.84-.692a1.875 1.875 0 0 0 .432-2.385l-.922-1.597a1.875 1.875 0 0 0-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 0 0-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 0 0-1.85-1.567h-1.844ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z" fill-rule="evenodd"></path>
</svg>
<span class="text-[10px] font-medium">Settings</span>
</a>
</div>
</nav>
<!-- END: Bottom Navigation -->
</body></html>
