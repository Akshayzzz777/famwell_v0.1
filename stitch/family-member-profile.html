<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<!-- Custom Tailwind Configuration -->
<script>

      }

<style data-purpose="custom-typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

<body class="bg-brand-light min-h-screen pb-24">

<!-- BEGIN: Health Notes -->
