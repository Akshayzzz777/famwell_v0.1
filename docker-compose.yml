version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: doc_processor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_processor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: doc_processor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ./backend
      dockerfile: infra/docker/Dockerfile.api
    container_name: doc_processor_api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_processor
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-your-project}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-your-bucket}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/config:/app/config
      - ./backend/shared:/app/shared
      - ./backend/api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: infra/docker/Dockerfile.worker
    container_name: doc_processor_worker
    environment:
      API_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_processor
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-your-project}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-your-bucket}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKER_CONCURRENCY: 4
      WORKER_JOB_TIMEOUT_SECONDS: 300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/config:/app/config
      - ./backend/shared:/app/shared
      - ./backend/worker:/app/worker

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doc_processor_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: doc_processor_network
